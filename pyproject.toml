[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-diff-gate"
dynamic = ["version"]
description = "Pre-commit quality gate for AI-generated code — flag churn and vulnerability patterns in the diff"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["ai", "agents", "claude", "llm", "code-review", "diff", "quality-gate", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/vartiainen1/agent-diff-gate"
Repository = "https://github.com/vartiainen1/agent-diff-gate"
Changelog = "https://github.com/vartiainen1/agent-diff-gate/blob/master/CHANGELOG.md"
Releases = "https://github.com/vartiainen1/agent-diff-gate/releases"

[project.scripts]
diff-gate = "check_diff:main"

[tool.setuptools]
py-modules = ["check_diff"]

[tool.setuptools_scm]
fallback_version = "0.0.0"
